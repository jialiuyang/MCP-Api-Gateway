spring:
  application:
    name: mcpg
  profiles:
    active: ${MCPG_PROFILE:dev}

server:
  port: ${MCPG_PORT:8088}
  compression:
    enabled: true
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,scheduledtasks
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.mcpg: DEBUG

app:
  version: @project.version@

# Scheduler tuning for the B3 milestone.
# - swagger-refresh re-pulls every service's OpenAPI document daily at 03:00.
# - registry-discovery polls every enabled registry on a fixed delay so newly
#   registered services are picked up without restarting the gateway.
mcpg:
  security:
    # Set MCPG_SECURITY_ENABLED=false only for local unit tests.
    enabled: ${MCPG_SECURITY_ENABLED:true}
    # Shared bearer token for /api/** and /mcp/**. When blank, a token is
    # generated into ./data/api-token.txt on first boot.
    api-token: ${MCPG_API_TOKEN:}
    # Optional AES key material for registry password encryption; defaults to
    # a SHA-256 derivation of the API token.
    secret-key: ${MCPG_SECRET_KEY:}
  ssrf:
    # Allow private/loopback targets for OpenAPI fetch + tool invocation.
    # Keep false for internet-facing deploys; true is OK for trusted VPC demos.
    allow-private: ${MCPG_SSRF_ALLOW_PRIVATE:false}
    # Optional exact / *.domain.com allow-list. Empty = any public host.
    allowed-hosts: []
  scheduler:
    swagger-refresh:
      enabled: true
      cron: 0 0 3 * * *
    registry-discovery:
      enabled: true
      # First run 30 seconds after startup, then every 5 minutes.
      initial-delay-ms: 30000
      fixed-delay-ms: 300000
